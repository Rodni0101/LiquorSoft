      <stop offset="100%" style="stop-color:#FFE8D0" />
    </linearGradient>
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <ellipse cx="100" cy="295" rx="50" ry="7" fill="#000" opacity="0.12"/>
  
  <g filter="url(#glassGlow)">
    <path d="M60 250 Q60 268 65 268 L65 283 Q65 293 73 293 L127 293 Q135 293 135 283 L135 268 Q140 268 140 250 L140 80 Q140 60 125 50 Q110 40 100 40 Q90 40 75 50 Q60 60 60 80 Z" 

    <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#3A5A7C">PREMIUM</text>
    <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#5A7A9C">40% ALC/VOL</text>

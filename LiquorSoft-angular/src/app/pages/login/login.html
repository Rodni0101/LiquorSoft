<div class="login-page">
  <div class="login-background"></div>

  <div class="login-container">
    <div class="login-brand">
      <div class="logo">Liquor<span>Soft</span></div>

      <p>Gestión inteligente para tu licorería</p>
    </div>

    <div class="login-card">
      <div class="login-header">
        <span class="login-tag"> BIENVENIDO DE NUEVO </span>

        <h1>Iniciar sesión</h1>

        <p>Ingresa a tu cuenta para continuar.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
        <div class="form-group">
          <label for="email"> Correo electrónico </label>

          <input type="email" id="email" formControlName="correo" placeholder="correo@ejemplo.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password"> Contraseña </label>

          <input type="password" id="password" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" formControlName="remember" />
            <span>Recordarme</span>
          </label>

          <button type="button" class="text-link" disabled title="Recuperación de contraseña disponible próximamente">¿Olvidaste tu contraseña?</button>
        </div>

        @if (errorMessage) { <p class="login-error" role="alert">{{ errorMessage }}</p> }
        <button type="submit" class="login-button" [disabled]="submitting">{{ submitting ? 'Ingresando…' : 'Iniciar sesión' }}</button>
      </form>

      <div class="login-divider">
        <span>o continúa con</span>
      </div>

      <button class="google-button">
        <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path
            fill="#FFC107"
            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
          />
          <path
            fill="#FF3D00"
            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
          />
          <path
            fill="#4CAF50"
            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
          />
          <path
            fill="#1976D2"
            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"
          />
        </svg>
        Continuar con Google
      </button>

      <div class="register-link">
        ¿No tienes una cuenta?

        <a routerLink="/register"> Regístrate </a>
      </div>
    </div>

    <a routerLink="/inicio" class="back-home"> ← Volver al inicio </a>
  </div>
</div>

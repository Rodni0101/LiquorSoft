    </linearGradient>
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <ellipse cx="100" cy="295" rx="58" ry="8" fill="#000" opacity="0.12"/>
  
  <g filter="url(#glassGlow)">

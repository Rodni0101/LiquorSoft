<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E1F5FE;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#E8F5E9;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#E1F5FE;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E1F5FE" />
      <stop offset="30%" style="stop-color:#B3E5FC" />
      <stop offset="60%" style="stop-color:#81D4FA" />
      <stop offset="100%" style="stop-color:#4FC3F7" />
    </linearGradient>
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0288D1" />
      <stop offset="100%" style="stop-color:#01579B" />
    </linearGradient>
    <linearGradient id="labelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E1F5FE" />
      <stop offset="100%" style="stop-color:#E1F5FE" />
    </linearGradient>
    <filter id="bubbles" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <ellipse cx="100" cy="295" rx="32" ry="5" fill="#000" opacity="0.08"/>
  
  <g filter="url(#glassGlow)">
    <path d="M80 250 Q80 260 83 260 L83 275 Q83 283 88 283 L112 283 Q117 283 117 275 L117 260 Q120 260 120 250 L120 70 Q120 50 105 40 Q100 30 100 30 Q95 40 80 70 Z" 
          fill="url(#glassGradient)" stroke="#81D4FA" stroke-width="0.5" opacity="0.7"/>
    
    <path d="M88 245 Q88 248 90 248 L90 272 Q90 278 94 278 L110 278 Q114 278 114 272 L114 248 Q116 248 116 245 Z"
          fill="url(#liquidGradient)" opacity="0.8"/>
    
    <circle cx="93" cy="260" r="1.5" fill="#FFFFFF" opacity="0.6">
      <animate attributeName="cy" from="260" to="100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.6" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="255" r="1.5" fill="#FFFFFF" opacity="0.5">
      <animate attributeName="cy" from="255" to="95" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.5" to="0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="265" r="1.5" fill="#FFFFFF" opacity="0.4">
      <animate attributeName="cy" from="265" to="105" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.4" to="0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="270" r="1.5" fill="#FFFFFF" opacity="0.4">
      <animate attributeName="cy" from="270" to="110" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.4" to="0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <path d="M95 70 L97 60 Q98 55 100 52 Q105 50 107 52 Q110 55 110 60 Z" fill="#E1F5FE" opacity="0.9"/>
    <path d="M97 72 Q97 68 99 65 Q100 62 102 62 Q103 65 103 68 Q105 72 103 72 Z" fill="#E1F5FE" opacity="0.7"/>
    
    <path d="M95 70 L97 62 Q98 57 100 54 Q105 52 107 54 Q110 57 110 62 L112 70" 
          fill="url(#glassGradient)" stroke="#81D4FA" stroke-width="0.5" opacity="0.7"/>
    
    <path d="M93 58 L97 48 Q98 43 100 40 Q105 37 107 37 Q110 40 110 43 L114 58 Q114 55 108 53 Q100 51 100 53 Q92 51 88 53 Q82 55 82 58 Z"
          fill="url(#capGradient)" stroke="#01579B" stroke-width="0.5"/>
    
    <ellipse cx="100" cy="30" rx="16" ry="2.5" fill="#01579B"/>
    <ellipse cx="100" cy="30" rx="14" ry="2" fill="#0288D1"/>
    
    <rect x="80" y="90" width="40" height="90" rx="3" fill="url(#labelGradient)" opacity="0.95" stroke="#81D4FA" stroke-width="0.5"/>
    
    <text x="100" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0288D1">TONICA</text>
    <text x="100" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#0288D1">PREMIUM</text>
    <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#0288D1">AGUA TONICA</text>
    <text x="100" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#0288D1">200 ML</text>
    
    <path d="M80 90 Q80 87 83 87 L117 87 Q120 87 120 90" fill="#0288D1" opacity="0.8"/>
    
    <path d="M75 85 Q82 105 78 135 Q75 165 72 195" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.2" stroke-linecap="round"/>
    <path d="M82 95 Q89 115 86 145 Q83 175 78 185" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.15" stroke-linecap="round"/>
    <path d="M120 90 Q113 110 115 140 Q118 170 120 180" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.1" stroke-linecap="round"/>
  </g>
</svg>
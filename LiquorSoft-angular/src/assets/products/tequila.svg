<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#FFF8F0;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFE8D0;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E0" />
      <stop offset="40%" style="stop-color:#FFE0B0" />
      <stop offset="100%" style="stop-color:#FFD080" />
    </linearGradient>
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3E2723" />

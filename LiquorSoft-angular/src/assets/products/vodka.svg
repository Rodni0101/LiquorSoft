      <stop offset="100%" style="stop-color:#A0A0A0" />
    </linearGradient>
    <linearGradient id="labelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F8FF" />
      <stop offset="100%" style="stop-color:#E8E8F8" />
    </linearGradient>
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <ellipse cx="100" cy="295" rx="48" ry="7" fill="#000" opacity="0.1"/>
  
  <g filter="url(#glassGlow)">
    <path d="M60 250 Q60 265 65 265 L65 282 Q65 292 73 292 L127 292 Q135 292 135 282 L135 265 Q140 265 140 250 L140 70 Q140 50 125 40 Q110 30 100 30 Q90 30 75 40 Q60 50 60 70 Z" 
